<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limelight – Project dashboard</title>
<meta name="description" content="Personal project, timesheet, finance and team-mentoring dashboard. Runs entirely in your browser.">
<meta name="theme-color" content="#0C3B42">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#16232F; --muted:#5B6977; --line:#D7DEE5;
  --brand:#0E5A63; --deep:#0C3B42; --lime:#CFE56B;
  --ok:#23794B; --warn:#9A6609; --bad:#B53A34; --done:#66768A; --info:#2A62A8; --todo:#66768A;
  --radius:10px;
  font-family:"Segoe UI","Avenir Next","Helvetica Neue",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1820; --surface:#15232D; --ink:#E6EDF2; --muted:#9DAEBC; --line:#273A49;
    --brand:#1F7F8A; --ok:#4CC17F; --warn:#E0A63A; --bad:#EE7B73; --done:#8C9CAD; --info:#6FA7EC; --todo:#8C9CAD}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-top:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(207,229,107,.35)}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.spacer{flex:1}
.tabs{display:flex;gap:4px;width:100%;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:650;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--brand)}

main{padding:20px 0 40px}
.hero{background:var(--deep);color:#fff;border-radius:14px;padding:26px 28px 0;margin-bottom:16px;overflow:hidden}
.hero h1{margin:0;font-size:28px;line-height:1.2;font-weight:650;max-width:760px}
.hero p{margin:6px 0 22px;color:#B9CDD1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(255,255,255,.14);margin:0 -28px}
.kpi{padding:16px 28px;border-right:1px solid rgba(255,255,255,.14)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:26px;font-weight:650;color:var(--lime);line-height:1.1}
.kpi span{font-size:13px;color:#B9CDD1}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s12{grid-column:span 12}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 span{font-weight:400;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:18px 4px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.sub{color:var(--muted);font-size:12px;max-width:340px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.is-done td:first-child{color:var(--muted);text-decoration:line-through}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}.done{--c:var(--done)}.info{--c:var(--info)}.todo{--c:var(--todo)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--brand)}
.bar.over>i{background:var(--bad)}
.late{color:var(--bad);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
.High{--c:var(--bad)}.Medium{--c:var(--warn)}.Low{--c:var(--done)}

.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin-bottom:12px}
.stack i{display:block;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.legend b{color:var(--ink)}
.rows{display:grid;gap:10px}
.wl{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center}
.wl .bar{height:10px}
.due{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0}
.due small{display:block;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea,select.inline{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toolbar input[type=search]{min-width:200px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:7px 13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select.inline{padding:3px 6px;font-size:13px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:var(--radius);padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--brand)}
.col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}
.col h3 span{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.card.dragging{opacity:.4}
.card p{margin:0 0 6px;font-weight:600}
.card div{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}

/* timeline */
.tl{min-width:760px}
.tl-head,.tl-row{display:grid;grid-template-columns:200px 1fr}
.tl-head{border-bottom:1px solid var(--line);height:26px}
.tl-axis{position:relative}
.tick{position:absolute;top:2px;font-size:12px;color:var(--muted);padding-left:6px;border-left:1px solid var(--line);height:24px}
.tl-row{border-bottom:1px solid var(--line)}
.tl-label{padding:8px 8px 8px 0;display:flex;flex-direction:column;justify-content:center}
.tl-label span{color:var(--muted);font-size:12px}
.tl-track{position:relative;height:50px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/12) 100%}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--lime);box-shadow:0 0 0 1px rgba(0,0,0,.25);z-index:2}
.tl-bar{position:absolute;top:8px;height:22px;border-radius:6px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));overflow:hidden}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.85}
.tl-bar span{position:relative;font-size:11px;font-weight:700;padding-left:6px;line-height:20px;color:var(--ink);mix-blend-mode:normal}
.tl-ms{position:absolute;top:34px;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:var(--ink);border:0;padding:0;cursor:pointer;z-index:3}
.tl-ms.done{background:var(--ok)}

/* timesheet */
table.ts th,table.ts td{text-align:center}
table.ts th:first-child,table.ts td:first-child{text-align:left}
.ts input{width:62px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 4px}
.ts .wknd{background:color-mix(in srgb,var(--line) 35%,transparent)}
.ts th.today{box-shadow:inset 0 -3px 0 var(--lime);color:var(--ink)}
.ts tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.weeknav{display:flex;gap:6px;align-items:center}
.weeknav b{min-width:180px;text-align:center}

/* finances */
.fin{display:grid;grid-template-columns:repeat(5,1fr);padding:18px 0}
.fin>div{padding:2px 20px;border-right:1px solid var(--line)}
.fin>div:last-child{border-right:0}
.fin b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.fin span{color:var(--muted);font-size:13px}
input.rate{width:104px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right}
tfoot.tot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.neg{color:var(--bad);font-weight:600}
@media (max-width:900px){.fin{grid-template-columns:repeat(2,1fr);gap:12px 0}.weeknav b{min-width:0}}

/* storage status */
.fs{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs.warn{color:var(--warn);font-weight:600}
.banner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner[hidden]{display:none}
.fspanel{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.fspanel p{margin:6px 0 10px;max-width:none}

/* allocation plan */
table.plan{min-width:max-content}
.plan th,.plan td{padding:6px 6px;text-align:center;white-space:nowrap}
.plan .s1,.plan .s2{position:sticky;background:var(--surface);z-index:1;text-align:left}
.plan .s1{left:0;min-width:104px}
.plan .s2{left:104px;min-width:120px;box-shadow:1px 0 0 var(--line)}
.plan th.wk,.plan td.pl{border-left:2px solid var(--line)}
.plan th.sh{font-weight:500}
.plan th.today{box-shadow:inset 0 -3px 0 var(--lime);color:var(--ink)}
.plan input{width:58px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 3px}
.plan td.ac input{background:color-mix(in srgb,var(--lime) 24%,var(--surface))}
.plan tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.toolbar .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
.toolbar .chk input{accent-color:var(--brand)}

/* mentoring */
.toolbar .seg{overflow-x:auto;max-width:100%}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry h4{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.entry p{margin:0;white-space:pre-wrap}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act small{display:block;color:var(--muted)}
.act.is-done strong{color:var(--muted);text-decoration:line-through}
.lvl{display:inline-flex;gap:4px;vertical-align:middle}
.lvl i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--brand)}
.lvl i.tg{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
td.heat{text-align:center;min-width:76px}
.out{box-shadow:inset 0 -3px 0 var(--warn)}
.wrap-text{white-space:pre-wrap;max-width:520px}
/* weekday absence calendar */
.cal-wrap{max-width:640px}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav b{flex:1;text-align:center;font-size:15px}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;margin-right:5px}
.cal-legend i.abs{background:color-mix(in srgb,var(--warn) 35%,var(--surface));border-color:var(--warn)}
.cal-legend i.hol{background:color-mix(in srgb,var(--bad) 28%,var(--surface));border-color:var(--bad)}
table.cal{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
table.cal th{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px}
table.cal td{padding:0;height:52px}
table.cal button.cal-day{width:100%;height:52px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
table.cal button.cal-day:hover{border-color:var(--brand)}
table.cal button.cal-day.today{box-shadow:inset 0 -3px 0 var(--lime)}
table.cal button.cal-day.abs{background:color-mix(in srgb,var(--warn) 32%,var(--surface));border-color:var(--warn)}
table.cal button.cal-day.hol{background:color-mix(in srgb,var(--bad) 26%,var(--surface));border-color:var(--bad)}
table.cal button.cal-day small{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
table.cal button.cal-day.abs small,table.cal button.cal-day.hol small{color:inherit}
table.cal button.cal-day.locked{cursor:default;opacity:.92}
table.cal button.cal-day.locked:hover{border-color:var(--bad)}
table.cal td.empty{background:transparent}
.cap-over{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad);font-weight:700}
.cap-hot{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.pin-btn{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;color:var(--muted)}
.pin-btn.on{color:var(--brand)}
.dense input.inline-date{padding:4px 6px;font-size:12px;max-width:132px}
.mine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mine-grid b{display:block;font-size:20px;font-weight:650}
.mine-grid span{color:var(--muted);font-size:12px}
@media (max-width:900px){.mine-grid{grid-template-columns:repeat(2,1fr)}}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(580px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,28,.55)}
dialog form,.dlg{padding:22px}
dialog h2{margin:0 0 14px;font-size:18px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.datalist{display:grid;gap:8px}
.datalist .btn{text-align:left}
.datalist small{display:block;font-weight:400;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw}
#toast.show{opacity:1}
.foot{color:var(--muted);font-size:12px;margin-top:20px}

@media (max-width:900px){
  .s7,.s5,.s6{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-bottom:1px solid rgba(255,255,255,.14)}
  .fields{grid-template-columns:1fr}
  .wrap{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>Limelight <small>Project dashboard</small></div>
    <div class="spacer"></div>
    <button class="fs" id="fileStatus" data-act="data" title="Where your data is saved"></button>
    <button class="btn" data-act="data">Data and backup</button>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-tab="overview">Overview</button>
      <button class="tab" role="tab" data-tab="projects">Projects</button>
      <button class="tab" role="tab" data-tab="tasks">Tasks</button>
      <button class="tab" role="tab" data-tab="timesheet">Timesheet</button>
      <button class="tab" role="tab" data-tab="absences">Absences</button>
      <button class="tab" role="tab" data-tab="capacity">Capacity</button>
      <button class="tab" role="tab" data-tab="timeline">Timeline</button>
      <button class="tab" role="tab" data-tab="finances">Finances</button>
      <button class="tab" role="tab" data-tab="risks">Risks</button>
      <button class="tab" role="tab" data-tab="mentoring">Mentoring</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="fileBanner" class="banner" role="alert" hidden></div>
  <div id="view"></div>
  <p class="foot">Your data is saved in this browser. In Chrome or Edge you can also point it at a file you choose (see “Data and backup”) so it syncs through OneDrive, Google Drive or Dropbox. <span>Limelight v1.6.2</span></p>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="dataDlg" aria-labelledby="dataTitle">
  <div class="dlg">
    <h2 id="dataTitle">Data and backup</h2>
    <div id="fsPanel" class="fspanel"></div>
    <div class="datalist">
      <button class="btn" data-act="export-json">Export backup (JSON)<small>Everything: projects, tasks, risks and milestones.</small></button>
      <button class="btn" data-act="import-json">Import backup (JSON)<small>Replaces the data on this computer with the backup file.</small></button>
      <button class="btn" data-act="export-csv">Export tasks (CSV)<small>Opens in Excel or Google Sheets.</small></button>
      <button class="btn" data-act="export-time">Export allocation plan (CSV)<small>Every resource and week with plan %, planned and actual hours, and cost.</small></button>
      <button class="btn" data-act="export-exp">Export expenses (CSV)<small>Every expense with project, date, category and amount.</small></button>
      <button class="btn" data-act="export-month">Export one month (CSV)<small>Hours by person and project for a month you choose.</small></button>
      <button class="btn" data-act="import-csv">Import tasks (CSV)<small>Columns: project, title, owner, status, priority, due (YYYY-MM-DD), notes. New project names are created automatically.</small></button>
      <button class="btn" data-act="backup-now">Download daily backup now<small>Also saved automatically once per day in this browser (last 14 days).</small></button>
      <button class="btn" data-act="backup-list">Restore an auto-backup<small>Pick from the last daily snapshots kept in this browser.</small></button>
      <button class="btn" data-act="sample">Load sample data<small>Replaces current data with a demo project set.</small></button>
      <button class="btn danger" data-act="clear">Clear all data<small>Removes everything from this browser.</small></button>
    </div>
    <div class="dlg-actions"><button class="btn" data-act="close-data">Close</button></div>
  </div>
</dialog>
<datalist id="ownerlist"></datalist>
<datalist id="catlist"></datalist>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const monday=d=>{const x=new Date(d+'T00:00:00');return addDays(d,-((x.getDay()+6)%7))};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);

function normalize(s){
  const settings=Object.assign({currency:'',pinned:[],myName:'',templates:[],lastAutoBackup:'',regions:[],personRegion:{}},s.settings||{});
  if(!Array.isArray(settings.pinned))settings.pinned=[];
  if(!Array.isArray(settings.templates))settings.templates=[];
  settings.myName=String(settings.myName||'');
  if(!Array.isArray(settings.regions)||!settings.regions.length)
    settings.regions=[{id:'india',name:'India'},{id:'sweden',name:'Sweden'}];
  else{
    settings.regions=settings.regions.map(r=>{
      const id=String(r.id||uid()),name=String(r.name||'Region').trim()||'Region';
      if(id==='default'||name.toLowerCase()==='default')return{id:'india',name:'India'};
      return{id,name};
    });
    const seen=new Set();settings.regions=settings.regions.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true});
    if(!settings.regions.some(r=>r.id==='india'))settings.regions.unshift({id:'india',name:'India'});
    if(!settings.regions.some(r=>r.id==='sweden'))settings.regions.push({id:'sweden',name:'Sweden'});
  }
  if(!settings.personRegion||typeof settings.personRegion!=='object')settings.personRegion={};
  const regionIds=new Set(settings.regions.map(r=>r.id));
  const fixRegion=id=>{const x=String(id||'india');return x==='default'?'india':(regionIds.has(x)?x:'india')};
  Object.keys(settings.personRegion).forEach(k=>{settings.personRegion[k]=fixRegion(settings.personRegion[k])});
  const legacyCur=settings.currency||'';
  const projects=(s.projects||[]).map(p=>{
    const o=Object.assign({},p);
    o.budgetEnd=o.budgetEnd||'';
    if(o.currency==null||o.currency===undefined)o.currency=legacyCur;
    o.currency=String(o.currency||'');
    if(o.pinned&&!settings.pinned.includes(o.id))settings.pinned.push(o.id);
    delete o.pinned;
    return o;
  });
  const mentees=s.mentees||[];
  const nameOf=id=>{const m=mentees.find(x=>x.id===id);return m?(m.name||'').trim():''};
  const resources=(s.resources||[]).map(r=>{
    const o=Object.assign({},r);
    o.holidayRegion=fixRegion(o.holidayRegion||settings.personRegion[(o.name||'').trim().toLowerCase()]||'india');
    const nk=(o.name||'').trim().toLowerCase();if(nk)settings.personRegion[nk]=o.holidayRegion;
    return o;
  });
  let timeOff=[];
  (Array.isArray(s.timeOff)?s.timeOff:[]).forEach(t=>{
    if(!t||!t.date)return;
    let person=(t.person!=null?t.person:'').trim();
    if(!person&&t.scope==='mentee')person=nameOf(t.refId||t.menteeId||'');
    let type=t.type==='holiday'?'holiday':'absence';
    let region=fixRegion(t.region||'india');
    if(type==='holiday'){person='';region=fixRegion(region)}
    else{region='';if(!person)return}
    const dup=type==='holiday'
      ?timeOff.some(x=>x.date===t.date&&x.type==='holiday'&&x.region===region)
      :timeOff.some(x=>x.date===t.date&&x.type==='absence'&&x.person.toLowerCase()===person.toLowerCase());
    if(!dup)timeOff.push({id:t.id||uid(),date:t.date,type,person,region});
  });
  /* Migrate legacy leave ranges → person absences once if nothing else loaded. */
  if(!timeOff.length&&Array.isArray(s.leave)){
    (s.leave||[]).forEach(l=>{
      if(!l||!l.menteeId||!l.start||!l.end)return;
      const person=nameOf(l.menteeId);if(!person)return;
      const kind=/holiday/i.test(l.type||'')?'holiday':'absence';
      for(let d=l.start;d<=l.end;d=addDays(d,1)){
        const wd=new Date(d+'T00:00:00').getDay();
        if(wd<1||wd>5)continue;
        if(kind==='holiday'){
          if(!timeOff.some(t=>t.date===d&&t.type==='holiday'&&t.region==='india'))
            timeOff.push({id:uid(),date:d,type:'holiday',person:'',region:'india'});
        }else if(!timeOff.some(t=>t.date===d&&t.type==='absence'&&t.person.toLowerCase()===person.toLowerCase()))
          timeOff.push({id:uid(),date:d,type:'absence',person,region:''});
      }
    });
  }
  return {projects,tasks:s.tasks||[],risks:s.risks||[],milestones:s.milestones||[],resources,alloc:s.alloc||{},expenses:s.expenses||[],mentees,oneonones:s.oneonones||[],actions:s.actions||[],goals:s.goals||[],skills:s.skills||[],feedback:s.feedback||[],leave:s.leave||[],timeOff,settings};
}

function weekLabel(w){

}
function planBandHtml(p){
  const t=planOf(p.id),burn=t.ph?Math.round(100*t.ah/t.ph):0,cur=pCurrency(p);

function planCatHtml(p){
  const cat={},cur=pCurrency(p);resOf(p.id).forEach(r=>{const x=resStats(r),c=r.category||'Other',t=cat[c]||(cat[c]={ph:0,pc:0,ah:0,ac:0});t.ph+=x.ph;t.pc+=x.pc;t.ah+=x.ah;t.ac+=x.ac});

function workingDaysBetween(from,to){
  if(!from||!to||to<from)return 0;
  let n=0,d=from;
  while(d<=to&&n<400){
    const wd=new Date(d+'T00:00:00').getDay();
    if(wd>=1&&wd<=5)n++;
    d=addDays(d,1);
  }
  return n;
}
function overlapWorkingDays(aFrom,aTo,bFrom,bTo){
  const from=aFrom>bFrom?aFrom:bFrom,to=aTo<bTo?aTo:bTo;
  return to<from?0:workingDaysBetween(from,to);
}
/* Calendar months (1st–last day), clipped to project dates — not week buckets. */
function calendarMonthsOf(p,endDate){
  if(!p||!p.start)return [];
  const end=endDate||p.end;if(!end||end<p.start)return [];
  const out=[];let y=+p.start.slice(0,4),m=+p.start.slice(5,7)-1;
  const endY=+end.slice(0,4),endM=+end.slice(5,7)-1;
  while(y<endY||(y===endY&&m<=endM)){
    const monthStart=iso(new Date(y,m,1)),monthEnd=iso(new Date(y,m+1,0));
    const from=monthStart<p.start?p.start:monthStart,to=monthEnd>end?end:monthEnd;
    if(from<=to)out.push({key:monthStart.slice(0,7),from,to,monthStart,monthEnd,days:workingDaysBetween(from,to)});
    m++;if(m>11){m=0;y++}
    if(out.length>120)break;
  }
  return out;
}
function projectMonthBudget(p){
  const months=calendarMonthsOf(p),planLimit=planEnd(p),weeks=weeksOf(p),res=resOf(p.id);
  return months.map(month=>{
    let ph=0,ah=0,pc=0,ac=0,xh=0,xc=0;
    const planTo=planLimit&&planLimit<month.to?planLimit:month.to;
    const planOk=!planLimit||month.from<=planLimit;
    res.forEach(r=>{
      const rate=+r.rate||0,hpw=+r.hpw||0;
      weeks.forEach(w=>{
        const a=allocOf(r.id,w.key),weekDays=workingDaysBetween(w.from,w.to)||1;
        const ovAct=overlapWorkingDays(w.from,w.to,month.from,month.to);
        if(ovAct){const f=ovAct/weekDays,ahW=(+a.actual||0)*f;ah+=ahW;ac+=ahW*rate}
        if(planOk&&planTo>=month.from){
          const ovPlan=overlapWorkingDays(w.from,w.to,month.from,planTo);
          if(ovPlan){
            const phW=((+a.pct||0)/100)*hpw*(ovPlan/5);ph+=phW;pc+=phW*rate;
            const absFrom=w.from>month.from?w.from:month.from,absTo=w.to<planTo?w.to:planTo;
            const absDays=offDaysForPerson(r.name,absFrom,absTo);
            if(absDays){const xW=((+a.pct||0)/100)*hpw*(absDays/5);xh+=xW;xc+=xW*rate}
          }
        }
      });
    });
    const eh=Math.max(0,ph-xh),ec=Math.max(0,pc-xc);
    return {m:month,ph,ah,pc,ac,xh,xc,eh,ec,var:ac-pc,evar:ac-ec};
  });
}

function updatePlanTotals(){
  if(ui.tab!=='timesheet'||!$('#planBand'))return;
  const p=state.projects.find(x=>x.id===ui.tsProject);if(!p)return;
  if(ui.tsGrain==='budget'){
    $('#planBand').innerHTML=planBandHtml(p);
    const cat=$('#planCat');if(cat)cat.innerHTML=planCatHtml(p);
    return;
  }
  const allWeeks=weeksOf(p),months=withMonthWeeks(calendarMonthsOf(p),allWeeks),res=resOf(p.id),cur=pCurrency(p),set=(sel,txt)=>{const el=$(sel);if(el)el.textContent=txt};
  const jumpMonth=months.find(m=>m.key===ui.tsMonth);
  if(ui.tsGrain==='month'){
    const T={ph:0,pc:0,ah:0,ac:0};
    res.forEach(r=>{const x=resStats(r),q=k=>'[data-rt="'+k+'"][data-r="'+r.id+'"]';
      T.ph+=x.ph;T.pc+=x.pc;T.ah+=x.ah;T.ac+=x.ac;
      set(q('ph'),hh(x.ph));set(q('pc'),money(x.pc,undefined,cur));set(q('ah'),hh(x.ah));set(q('ac'),money(x.ac,undefined,cur));set(q('used'),x.ph?Math.round(100*x.ah/x.ph)+'%':'–')});
    months.forEach(m=>{let pc=0,phTot=0,ac=0;res.forEach(r=>{
      const pct=monthPctOf(r.id,m);if(pct)pc+=pct;
      const rph=monthPlannedOf(r.id,m,r.hpw);phTot+=rph;
      const rah=monthActualOf(r.id,m);ac+=rah;
      const phEl=$('[data-mt="planned"][data-r="'+r.id+'"][data-m="'+m.key+'"]');if(phEl)phEl.textContent=rph?hh(rph):'–';
      const ahEl=$('[data-mt="actual"][data-r="'+r.id+'"][data-m="'+m.key+'"]');if(ahEl)ahEl.textContent=rah?hh(rah):'–';
    });
      set('[data-mtot="pct"][data-m="'+m.key+'"]',pc?pc+'%':'–');
      set('[data-mtot="planned"][data-m="'+m.key+'"]',phTot?hh(phTot):'–');
      set('[data-mtot="actual"][data-m="'+m.key+'"]',ac?hh(ac):'–')});
    set('[data-tt="ph"]',hh(T.ph));set('[data-tt="pc"]',money(T.pc,undefined,cur));set('[data-tt="ah"]',hh(T.ah));set('[data-tt="ac"]',money(T.ac,undefined,cur));set('[data-tt="used"]',T.ph?Math.round(100*T.ah/T.ph)+'%':'–');
  }else{
    const segs=weekSegmentsInMonth(allWeeks,jumpMonth),vis=visibleWeekTotals(res,segs);
    res.forEach(r=>{
      let ph=0,ah=0;segs.forEach(w=>{ph+=weekPlannedOf(r.id,w,r.hpw);ah+=weekActualOf(r.id,w)});
      const rate=+r.rate||0,pc=ph*rate,ac=ah*rate,q=k=>'[data-rt="'+k+'"][data-r="'+r.id+'"]';
      set(q('ph'),hh(ph));set(q('pc'),money(pc,undefined,cur));set(q('ah'),hh(ah));set(q('ac'),money(ac,undefined,cur));set(q('used'),ph?Math.round(100*ah/ph)+'%':'–');
    });
    segs.forEach(w=>{let pc=0,phTot=0,ac=0;res.forEach(r=>{
      const a=allocOf(r.id,w.key),ph=weekPlannedOf(r.id,w,r.hpw),ah=weekActualOf(r.id,w);
      pc+=+a.pct||0;phTot+=ph;ac+=ah;
      const phEl=$('[data-wt="planned"][data-seg="'+w.segId+'"][data-r="'+r.id+'"]');if(phEl)phEl.textContent=ph?hh(ph):'–';
      const ahInp=$('input[data-fld="actual"][data-seg="'+w.segId+'"][data-r="'+r.id+'"]');
      if(ahInp&&document.activeElement!==ahInp)ahInp.value=ah?hh(ah):'';
    });
      document.querySelectorAll('tfoot [data-wt="pct"][data-seg="'+w.segId+'"]').forEach(el=>{el.textContent=pc?pc+'%':'–'});
      document.querySelectorAll('tfoot [data-wt="planned"][data-seg="'+w.segId+'"]').forEach(el=>{el.textContent=phTot?hh(phTot):'–'});
      document.querySelectorAll('tfoot [data-wt="actual"][data-seg="'+w.segId+'"]').forEach(el=>{el.textContent=ac?hh(ac):'–'});
    });
    set('[data-tt="ph"]',hh(vis.ph));set('[data-tt="pc"]',money(vis.pc,undefined,cur));set('[data-tt="ah"]',hh(vis.ah));set('[data-tt="ac"]',money(vis.ac,undefined,cur));set('[data-tt="used"]',vis.ph?Math.round(100*vis.ah/vis.ph)+'%':'–');
    const band=$('#weekMonthBand');if(band)band.innerHTML=weekMonthBandHtml(jumpMonth,res,segs,cur);
  }
  $('#planBand').innerHTML=planBandHtml(p);$('#planCat').innerHTML=planCatHtml(p);
}

function viewCapacity(){
  const names=[...new Set(state.resources.map(r=>(r.name||'').trim()).filter(Boolean))].sort();
  if(!names.length)return '<section class="panel"><p class="empty">Add resources on the Timesheet tab to see capacity across projects.</p></section>';

  const weeks=[];for(let i=0;i<8;i++)weeks.push(addDays(start,i*7));
  const rows=names.map(name=>{
    const mine=state.resources.filter(r=>(r.name||'').trim()===name);
    const cells=weeks.map(wk=>{
      let pct=0;mine.forEach(r=>{pct+=+allocOf(r.id,wk).pct||0});
      const cls=pct>100?'cap-over':pct>=90?'cap-hot':'';
      return '<td class="num '+cls+'">'+(pct?pct+'%':'–')+'</td>';
    }).join('');
    const tot=weeks.reduce((s,wk)=>s+mine.reduce((a,r)=>a+(+allocOf(r.id,wk).pct||0),0),0);
    return '<tr><td><strong>'+esc(name)+'</strong><div class="sub">'+mine.length+' assignment'+(mine.length===1?'':'s')+'</div></td>'+cells+'<td class="num">'+(tot?Math.round(tot/weeks.length)+'% avg':'–')+'</td></tr>';

    '<section class="panel"><h2>Capacity <span>8 weeks from '+esc(fmt(start))+'</span></h2><div class="scroll"><table><thead><tr><th>Person</th>'+
    weeks.map(w=>'<th class="num">'+esc(fmt(w))+'</th>').join('')+'<th class="num">Avg</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}

function monthRollup(){
  const map=new Map();
  state.projects.forEach(p=>{
    projectMonthBudget(p).forEach(x=>{
      let m=map.get(x.m.key);if(!m){m={key:x.m.key,ph:0,ah:0,pc:0,ac:0};map.set(x.m.key,m)}
      m.ph+=x.ph;m.ah+=x.ah;m.pc+=x.pc;m.ac+=x.ac;
    });
  });
  return [...map.values()].sort((a,b)=>a.key.localeCompare(b.key));
}

/* ---------- import / export ---------- */
function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),800);
}
const csvCell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function normDate(s){
  s=(s||'').trim();if(!s)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);return isNaN(d)?'':iso(d);
}
const pick=(v,list,def)=>list.find(x=>x.toLowerCase()===String(v||'').trim().toLowerCase())||def;
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('That CSV has no data rows.');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=n=>head.indexOf(n);
  if(col('title')<0){toast('The CSV needs a “title” column.');return}
  let added=0,newProj=0;
  rows.slice(1).forEach(r=>{
    const g=n=>col(n)<0?'':(r[col(n)]||'').trim();
    if(!g('title'))return;
    let proj=state.projects.find(p=>p.name.toLowerCase()===g('project').toLowerCase());
    if(!proj){proj={id:uid(),name:g('project')||'Imported tasks',owner:'',status:'On track',start:today,end:addDays(today,60),budgetEnd:'',currency:'',budget:0,spent:0,notes:''};
      const again=state.projects.find(p=>p.name===proj.name);if(again)proj=again;else{state.projects.push(proj);newProj++}}
    state.tasks.push({id:uid(),projectId:proj.id,title:g('title'),owner:g('owner'),status:pick(g('status'),TASK_STATUS,'To do'),priority:pick(g('priority'),PRIORITY,'Medium'),due:normDate(g('due')),notes:g('notes')});
    added++;
  });
  save();render();toast('Imported '+added+' tasks'+(newProj?' and created '+newProj+' project'+(newProj>1?'s':''):'')+'.');
}

/* ---------- auto backup (IndexedDB, last 14 days) ---------- */
function queueAutoBackup(){
  try{
    if(state.settings.lastAutoBackup===today)return;
    state.settings.lastAutoBackup=today;
    saveLocal();
    idbSet('backup:'+today,JSON.stringify(state)).then(()=>idbTrimBackups()).catch(()=>{});
  }catch(e){}
}
async function idbTrimBackups(){
  try{
    const db=await idb();
    const keys=await new Promise((res,rej)=>{const q=db.transaction('h','readonly').objectStore('h').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
    const backs=keys.filter(k=>String(k).startsWith('backup:')).map(String).sort();
    const drop=backs.slice(0,Math.max(0,backs.length-14));
    for(const k of drop)await idbDel(k);
  }catch(e){}
}
async function listAutoBackups(){
  try{
    const db=await idb();
    const keys=await new Promise((res,rej)=>{const q=db.transaction('h','readonly').objectStore('h').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
    return keys.filter(k=>String(k).startsWith('backup:')).map(k=>String(k).slice(7)).sort().reverse();
  }catch(e){return []}
}

  state.resources.forEach(r=>{

    weeksOf(p).filter(w=>monthKey(w.from)===ym).forEach(w=>{
      const a=allocOf(r.id,w.key),ph=((+a.pct||0)/100)*(+r.hpw||0)*w.factor,ah=+a.actual||0;
      if(!a.pct&&!ah)return;

const FS={ok:typeof window.showOpenFilePicker==='function'&&typeof window.showSaveFilePicker==='function',
  h:null,name:'',state:'none',lastSeen:0,lastText:'',dirty:false,timer:null,writing:false,pending:false,conflictText:''};
const FS_META='limelight-fs-meta',FS_TYPES=[{description:'Limelight data (JSON)',accept:{'application/json':['.json']}}];

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('limelight-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const q=fn(db.transaction('h',mode).objectStore('h'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const idbGet=k=>idbOp('readonly',o=>o.get(k)),idbSet=(k,v)=>idbOp('readwrite',o=>o.put(v,k)),idbDel=k=>idbOp('readwrite',o=>o.delete(k));
function fsParse(t){try{const x=JSON.parse(t);return x&&Array.isArray(x.projects)?x:null}catch(e){return null}}
function fsStatus(){
  const el=$('#fileStatus');if(!el)return;

  if(FS.h){if(FS.state==='live')t=(FS.dirty||FS.writing)?'Saving to '+FS.name+'…':'Saved to '+FS.name;else{t='File paused: '+FS.name;c='warn'}}
  el.textContent=t;el.className='fs '+c;
}
function fsBanner(show,html){const b=$('#fileBanner');if(!b)return;b.hidden=!show;b.innerHTML=show?html:''}

  const dlg=$('#dlg');
  dlg.innerHTML='<div class="dlg"><h2 id="dlgTitle">Data file changed elsewhere</h2><p>“'+esc(FS.name)+'” was changed by another computer or browser since this browser last synced. Choose which version to keep.</p>'+
    '<div class="datalist"><button class="btn" data-act="fs-use-file">Use the file’s version<small>Replaces the data in this browser with what is in the file.</small></button>'+
    '<button class="btn" data-act="fs-use-mine">Keep this browser’s version<small>Overwrites the file with the data in this browser.</small></button>'+
    '<button class="btn" data-act="export-json">Download this browser’s version first<small>Saves a JSON copy so nothing is lost, then choose above.</small></button></div></div>';
  dlg.setAttribute('aria-labelledby','dlgTitle');if(!dlg.open)dlg.showModal();
}
function fsMarkDirty(){
  if(!FS.h)return;
  FS.dirty=true;fsSaveMeta();fsStatus();
  if(FS.state==='live'){clearTimeout(FS.timer);FS.timer=setTimeout(fsFlush,500)}
}
async function fsFlush(){
  if(FS.state!=='live'||!FS.h)return;
  if(FS.writing){FS.pending=true;return}
  FS.writing=true;fsStatus();
  try{
    const f=await FS.h.getFile();
    if(f.lastModified!==FS.lastSeen){const t=await f.text();if(t!==FS.lastText){FS.writing=false;FS.conflictText=t;fsConflict();return}FS.lastSeen=f.lastModified}
    const text=JSON.stringify(state,null,2),w=await FS.h.createWritable();
    await w.write(text);await w.close();
    const f2=await FS.h.getFile();FS.lastSeen=f2.lastModified;FS.lastText=text;
    FS.dirty=JSON.stringify(state,null,2)!==text;fsSaveMeta();
  }catch(e){fsPaused('Could not save to “'+FS.name+'”. Your changes are safe in this browser. Reconnect to resume saving to the file.')}
  FS.writing=false;fsStatus();
  if(FS.pending){FS.pending=false;if(FS.state==='live')fsFlush()}
}
async function fsConnect(){
  try{
    const f=await FS.h.getFile(),text=await f.text(),mine=JSON.stringify(state,null,2);
    if(FS.dirty){
      if(f.lastModified>FS.lastSeen+50&&text.trim()&&text!==mine){FS.conflictText=text;fsConflict();return}
      FS.state='live';FS.lastSeen=f.lastModified;FS.lastText=text;fsBanner(false);fsStatus();await fsFlush();return;
    }
    FS.state='live';fsBanner(false);
    if(!text.trim()){FS.lastSeen=f.lastModified;FS.lastText='';FS.dirty=true;fsSaveMeta();fsStatus();await fsFlush();return}
    const x=fsParse(text);
    if(!x){fsPaused('“'+FS.name+'” does not contain Limelight data.');return}
    if(text!==mine){state=normalize(x);saveLocal();render()}
    FS.lastSeen=f.lastModified;FS.lastText=text;fsSaveMeta();fsStatus();
  }catch(e){fsPaused('Cannot read “'+FS.name+'”. It may have been moved or deleted.')}
}
async function fsInit(){
  fsStatus();if(!FS.ok)return;
  let h;try{h=await idbGet('data')}catch(e){}
  if(!h)return;
  const m=fsMeta();FS.h=h;FS.name=h.name;FS.lastSeen=m.lastSeen||0;FS.dirty=!!m.dirty;FS.state='paused';
  let perm='prompt';try{perm=await h.queryPermission({mode:'readwrite'})}catch(e){}
  if(perm==='granted')await fsConnect();else fsPaused('Click Reconnect to let Limelight keep saving to “'+FS.name+'”.');
}
async function fsReconnect(){
  if(!FS.h)return;
  try{if(await FS.h.requestPermission({mode:'readwrite'})!=='granted'){toast('Permission is needed to save to the file.');return}await fsConnect()}
  catch(e){fsPaused('Cannot reach “'+FS.name+'”. It may have been moved or deleted.')}
  fsPanelRefresh();
}
async function fsLink(h,f,text){
  FS.h=h;FS.name=h.name;FS.state='live';FS.lastSeen=f?f.lastModified:0;FS.lastText=text;FS.dirty=false;fsSaveMeta();fsBanner(false);fsStatus();
  try{await idbSet('data',h)}catch(e){toast('Connected, but this browser could not remember the file for next time.')}
}
async function fsOpen(){
  try{
    const arr=await window.showOpenFilePicker({types:FS_TYPES,multiple:false}),h=arr[0];
    if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('Permission is needed to save to that file.');return}
    const f=await h.getFile(),text=await f.text();
    if(text.trim()){
      const x=fsParse(text);if(!x){toast('That file does not contain Limelight data.');return}
      if(!confirm('Load the data in “'+h.name+'”? It replaces what is currently in this browser, and changes will then save to that file automatically.'))return;
      await fsLink(h,f,text);state=normalize(x);saveLocal();render();toast('Loaded '+h.name+'. Changes now save to it.');
    }else{await fsLink(h,f,'');FS.dirty=true;fsSaveMeta();await fsFlush();toast('Saving to '+h.name+'.')}
  }catch(e){if(!e||e.name!=='AbortError')toast('Could not open that file.')}
  fsPanelRefresh();
}
async function fsCreate(){
  try{
    const h=await window.showSaveFilePicker({suggestedName:'limelight-data.json',types:FS_TYPES});
    await fsLink(h,null,'');FS.dirty=true;fsSaveMeta();await fsFlush();toast('Saving to '+h.name+'.');
  }catch(e){if(!e||e.name!=='AbortError')toast('Could not create that file.')}
  fsPanelRefresh();
}
async function fsDisconnect(){
  if(!confirm('Stop saving to “'+FS.name+'”? Your data stays in this browser and the file is left as it is.'))return;
  clearTimeout(FS.timer);FS.h=null;FS.name='';FS.state='none';FS.dirty=false;fsSaveMeta();
  try{await idbDel('data')}catch(e){}
  fsBanner(false);fsStatus();fsPanelRefresh();toast('Saving in this browser only.');
}
async function fsUseFile(){
  const x=fsParse(FS.conflictText);if(!x){toast('The file does not contain valid Limelight data.');return}
  try{FS.lastSeen=(await FS.h.getFile()).lastModified}catch(e){}
  state=normalize(x);saveLocal();FS.lastText=FS.conflictText;FS.dirty=false;FS.state='live';fsSaveMeta();fsBanner(false);fsStatus();
  $('#dlg').close();render();toast('Loaded the file’s version.');
}
async function fsUseMine(){
  try{FS.lastSeen=(await FS.h.getFile()).lastModified;FS.lastText=FS.conflictText}catch(e){}
  FS.state='live';FS.dirty=true;fsBanner(false);$('#dlg').close();await fsFlush();toast('Overwrote the file with this browser’s data.');
}
async function fsRefresh(){
  if(FS.state!=='live'||!FS.h||FS.dirty||FS.writing||document.querySelector('dialog[open]'))return;
  try{
    const f=await FS.h.getFile();if(f.lastModified===FS.lastSeen)return;
    const text=await f.text();FS.lastSeen=f.lastModified;fsSaveMeta();
    if(text!==FS.lastText){const x=fsParse(text);if(x){state=normalize(x);saveLocal();FS.lastText=text;render();toast('Loaded newer data from '+FS.name+'.')}}
  }catch(e){}
}
function fsPanelHtml(){
  const h3='<strong>Where your data is saved</strong>';
  if(!FS.ok)return h3+'<p class="sub">In this browser only. This browser cannot save to a file you choose; Chrome and Edge can. Use Export and Import backup below to move data between computers, or open Limelight in Chrome or Edge for automatic file saving.</p>';
  if(FS.h){
    const live=FS.state==='live';
    return h3+'<p class="sub">'+(live?'Saving automatically to <b>'+esc(FS.name)+'</b>. Keep that file in a OneDrive, Google Drive or Dropbox folder to share it between computers.':'Paused for <b>'+esc(FS.name)+'</b>. Reconnect to resume saving to it. Your changes are safe in this browser meanwhile.')+'</p>'+
      '<div class="datalist">'+(live?'':'<button class="btn" data-act="fs-reconnect">Reconnect</button>')+'<button class="btn" data-act="fs-open">Open a different data file</button><button class="btn" data-act="fs-create">Create a new data file</button><button class="btn danger" data-act="fs-disconnect">Stop using this file</button></div>';
  }
  return h3+'<p class="sub">Right now: in this browser only. Choose a data file on your computer and Limelight saves to it automatically. Put the file in a OneDrive, Google Drive or Dropbox folder to share it across computers, and open the same file once on each computer.</p>'+
    '<div class="datalist"><button class="btn" data-act="fs-open">Open an existing data file<small>Use this on a second computer, or to load a file you saved before.</small></button><button class="btn" data-act="fs-create">Create a new data file<small>Saves your current data into a new .json file in a folder you pick.</small></button></div>';
}
function fsPanelRefresh(){const p=$('#fsPanel');if(p)p.innerHTML=fsPanelHtml()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;render();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const {act,kind,id}=a.dataset;
  switch(act){
    case 'add':openForm(kind);break;
    case 'edit':openForm(kind,id);break;
    case 'del':remove(kind,id);break;
    case 'close':$('#dlg').close();break;
    case 'filter-project':ui.fProject=id;ui.fOwner='';ui.fStatus='';ui.q='';ui.tab='tasks';render();break;
    case 'tv':ui.taskView=a.dataset.v;render();break;
    case 'data':fsPanelRefresh();$('#dataDlg').showModal();break;
    case 'fs-open':fsOpen();break;
    case 'fs-create':fsCreate();break;
    case 'fs-disconnect':fsDisconnect();break;
    case 'fs-reconnect':fsReconnect();break;
    case 'fs-resolve':fsConflictDialog();break;
    case 'fs-use-file':fsUseFile();break;
    case 'fs-use-mine':fsUseMine();break;
    case 'mtab':ui.mTab=a.dataset.v;render();break;
    case 'ts-grain':ui.tsGrain=['month','budget','estimate'].includes(a.dataset.v)?a.dataset.v:'week';render();break;
    case 'cal-month':{
      const d=a.dataset.delta;ui.calMonth=d==='0'?monthKey(today):shiftMonthKey(ui.calMonth||monthKey(today),+d||0);render();break}
    case 'abs-mode':ui.absMode=a.dataset.v==='absence'?'absence':'holiday';render();break;
    case 'abs-region':ui.absMode='holiday';ui.absRegion=a.dataset.id||'india';ui.tab='absences';render();break;
    case 'abs-person':ui.absMode='absence';ui.absPerson=a.dataset.person||'';ui.tab='absences';render();break;
    case 'add-region':addHolidayRegion();break;
    case 'toff-toggle':toggleTimeOff(a.dataset.mode||'holiday',a.dataset.ref||'',a.dataset.date);break;
    case 'filter-mentee':ui.mMentee=id;ui.mTab='oneonones';render();break;
    case 'close-data':$('#dataDlg').close();break;
    case 'export-json':download('limelight-backup-'+today+'.json',JSON.stringify(state,null,2),'application/json');break;
    case 'import-json':$('#fileJson').click();break;
    case 'import-csv':$('#fileCsv').click();break;
    case 'export-csv':{
      const rows=[['project','title','owner','status','priority','due','notes']].concat(state.tasks.map(t=>[pName(t.projectId),t.title,t.owner,t.status,t.priority,t.due,t.notes]));
      download('limelight-tasks-'+today+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');break}
    case 'export-time':{
      const rows=[['project','category','resource','hourly rate','hours per week','week starting','plan %','planned hours','actual hours','planned cost','actual spent']];
      state.resources.forEach(r=>{const pre=r.id+'|';Object.keys(state.alloc).filter(k=>k.startsWith(pre)).sort().forEach(k=>{
        const a=state.alloc[k],ph=(+a.pct||0)/100*(+r.hpw||0),ah=+a.actual||0;
        rows.push([pName(r.projectId),r.category,r.name,r.rate,r.hpw,k.slice(pre.length),a.pct||0,ph,ah,ph*r.rate,ah*r.rate])})});
      download('limelight-allocation-'+today+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');break}
    case 'export-exp':{
      const rows=[['project','date','category','description','amount']].concat([...state.expenses].sort((x,y)=>x.date.localeCompare(y.date)).map(x=>[pName(x.projectId),x.date,x.category,x.description,x.amount]));
      download('limelight-expenses-'+today+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');break}
    case 'export-month':{
      const ym=prompt('Month to export (YYYY-MM)',monthKey(today));if(ym)exportMonthCsv(ym.trim());break}
    case 'backup-now':
      download('limelight-backup-'+today+'.json',JSON.stringify(state,null,2),'application/json');
      state.settings.lastAutoBackup='';queueAutoBackup();toast('Backup downloaded.');break;
    case 'backup-list':openBackupList();break;
    case 'restore-backup':restoreBackupDay(a.dataset.day);break;
    case 'toggle-pin':togglePin(id);break;
    case 'budget-from-plan':setBudgetFromPlan(id);break;
    case 'quick-actuals':openQuickActuals();break;
    case 'save-template':savePlanTemplate();break;
    case 'apply-template':applyPlanTemplate(id);break;
    case 'apply-tpl-id':applyTemplateById(id,a.dataset.tid);break;
    case 'cap-week':{
      const v=a.dataset.v;if(v==='0')ui.capWeek=monday(today);
      else ui.capWeek=addDays(ui.capWeek||monday(today),(+v||0)*7);
      render();break}
    case 'sample':if(confirm('Replace your current data with the sample data?')){state=normalize(sample());save();render();$('#dataDlg').close();toast('Sample data loaded.')}break;
    case 'clear':if(confirm('Remove all projects, tasks, risks and milestones from this browser? Export a backup first if you may need them.')){state=normalize({});save();render();$('#dataDlg').close();toast('All data cleared.')}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='status'){const x=state.tasks.find(k=>k.id===t.dataset.id);if(x){x.status=t.value;save();renderTaskBody()}return}
  if(t.dataset.act==='ms-done'){const m=state.milestones.find(k=>k.id===t.dataset.id);if(m){m.done=t.checked;save();render()}return}
  if(t.dataset.fld){
    let v=parseFloat(t.value);if(!(v>0))v=0;
    v=Math.round(v*100)/100;if(t.dataset.fld==='pct')v=Math.min(v,500);
    if(t.dataset.fld==='pct'){
      const p=state.projects.find(x=>x.id===ui.tsProject),weeks=weeksOf(p||{});
      let targets=weeks;
      if(t.dataset.grain==='month'&&!ui.tsFillAll){
        const m=withMonthWeeks(calendarMonthsOf(p||{}),weeks).find(x=>x.key===t.dataset.m);
        targets=m?m.weeks:[];
      }else if(t.dataset.grain!=='month'&&!ui.tsFillAll){
        targets=weeks.filter(w=>w.key===t.dataset.w);
      }
      applyPctToWeeks(t.dataset.r,targets,v);
      document.querySelectorAll('input[data-fld="pct"][data-r="'+t.dataset.r+'"]').forEach(inp=>{
        if(ui.tsFillAll){inp.value=v||'';return}
        if(t.dataset.grain==='month'&&inp.dataset.m===t.dataset.m)inp.value=v||'';
        if(t.dataset.grain!=='month'&&inp.dataset.w===t.dataset.w)inp.value=v||'';
      });
      t.value=v||'';save();updatePlanTotals();
      if(v>100)toast('Above 100% means more than the standard hours per week.');
      return;
    }
    if(t.dataset.fld==='actual'){
      const share=parseFloat(t.dataset.share||'1')||1;
      const stored=share>0?Math.round((v/share)*100)/100:v;
      setAlloc(t.dataset.r,t.dataset.w,'actual',stored);
      t.value=v||'';save();updatePlanTotals();
      return;
    }
    setAlloc(t.dataset.r,t.dataset.w,t.dataset.fld,v);t.value=v||'';save();updatePlanTotals();
    return}
  if(t.dataset.act==='act-done'){const x=state.actions.find(k=>k.id===t.dataset.id);if(x){x.done=t.checked;save();render()}return}
  if(t.dataset.act==='goal-progress'){const g=state.goals.find(k=>k.id===t.dataset.id);if(g){g.progress=Math.max(0,Math.min(100,Number(t.value)||0));if(g.progress===100)g.status='Achieved';save();render()}return}
  if(t.id==='mFilter'){ui.mMentee=t.value;render();return}
  if(t.id==='absPerson'){ui.absPerson=t.value;ui.absMode='absence';render();return}
  if(t.id==='absRegion'){ui.absRegion=t.value;ui.absMode='holiday';render();return}
  if(t.id==='personRegion'){setPersonRegion(ui.absPerson,t.value);return}
  if(t.id==='tsFillAll'){ui.tsFillAll=t.checked;return}
  if(t.id==='tsProject'){ui.tsProject=t.value;ui.tsMonth='';render();return}
  if(t.id==='tsMonth'){ui.tsMonth=t.value;render();return}
  if(t.dataset.act==='proj-date'){
    const p=state.projects.find(x=>x.id===t.dataset.id);if(!p)return;
    const fld=t.dataset.fld,val=t.value||'';
    if(fld==='start'||fld==='end'){
      const prev={start:p.start,end:p.end};p[fld]=val;
      if(p.start&&p.end&&p.end<p.start){p.start=prev.start;p.end=prev.end;t.value=prev[fld]||'';toast('End date must be on or after the start date.');return}
      syncPlanForProject(p);save();render();toast('Dates updated — timesheet plan recalculated.');
    }
    return;
  }
  if(t.id==='fxProject'){ui.fxProject=t.value;render();return}
  if(['fProject','fOwner','fStatus'].includes(t.id)){ui[t.id]=t.value;renderTaskBody();return}
  if(t.id==='fileJson'&&t.files[0]){
    t.files[0].text().then(txt=>{try{const s=JSON.parse(txt);if(!s||!Array.isArray(s.projects))throw 0;
      if(confirm('Replace the data on this computer with this backup?')){state=normalize(s);save();render();$('#dataDlg').close();toast('Backup restored.')}}
      catch(err){toast('That file is not a Limelight backup.')}t.value=''});return}
  if(t.id==='fileCsv'&&t.files[0]){t.files[0].text().then(txt=>{importCSV(txt);t.value='';$('#dataDlg').close()});return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;renderTaskBody()}});

/* drag and drop on the board */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.col.over').forEach(n=>n.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.col.over').forEach(n=>n.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();
  const t=state.tasks.find(x=>x.id===dragId);if(t&&t.status!==c.dataset.status){t.status=c.dataset.status;save();toast('Moved to '+t.status+'.')}dragId=null;renderTaskBody()});

render();
fsInit();
queueAutoBackup();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')fsRefresh();
  else if(FS.h&&FS.dirty&&FS.state==='live'){clearTimeout(FS.timer);fsFlush()}
});
window.addEventListener('focus',fsRefresh);
window.addEventListener('beforeunload',e=>{if(FS.h&&FS.state==='live'&&(FS.dirty||FS.writing)){e.preventDefault();e.returnValue=''}});
})();
</script>
